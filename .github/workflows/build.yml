name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect zip
        run: unzip -l tokenhunter-structure.zip

      - name: Extract project
        run: |
          unzip -o tokenhunter-structure.zip -d ./tmp
          if [ -f ./tmp/settings.gradle.kts ] || [ -d ./tmp/app ]; then
            cp -a ./tmp/. .
          else
            cp -a ./tmp/*/. .
          fi
          rm -rf ./tmp
          echo "--- ریشه بعد از استخراج ---"
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: app/build/outputs/apk/debug/*.apk
